<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Graduation cap in the colours of the page gradient on its dark surface.
       Solid fills, not a gradient: at tab size a gradient is invisible anyway.
       No double hyphens in these comments: XML forbids them, and browsers then reject the whole icon. -->
  <rect width="64" height="64" rx="14" fill="#151821"/>
  <!-- cap under the board: the blue end of the gradient -->
  <path d="M17 31v9c0 4.5 6.7 8.5 15 8.5s15-4 15-8.5v-9l-15 7z" fill="#4f8bff"/>
  <!-- the flat board: the violet middle -->
  <path d="M32 13 5 25.5 32 38l27-12.5z" fill="#9b72f2"/>
  <!-- tassel: the pink end -->
  <path d="M53 28v12" stroke="#d96bb0" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="53" cy="43" r="3.2" fill="#d96bb0"/>
</svg>
